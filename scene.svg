<svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .sway {
                transform-box: fill-box;
                transform-origin: 50% 100%;
                animation: sway 3s ease-in-out infinite alternate;
            }
            .slow {
                animation-duration: 4.5s;
            }
            .eyes {
                animation: blink 2s infinite;
            }
            @keyframes sway {
                from { transform: rotate(-3deg); }
                to { transform: rotate(3deg); }
            }
            @keyframes blink {
                0%, 90% { opacity: 1; }
                95% { opacity: 0.1; }
                100% { opacity: 1; }
            }
        </style>
        <g id="zom">
            <line x1="0" y1="-45" x2="-9" y2="0" stroke="#000000" stroke-width="9"/>
            <line x1="2" y1="-45" x2="12" y2="0" stroke="#000000" stroke-width="9"/>
            <rect x="-14" y="-98" width="28" height="56" fill="#000000"/>
            <line x1="6" y1="-88" x2="52" y2="-92" stroke="#000000" stroke-width="7"/>
            <line x1="6" y1="-80" x2="48" y2="-76" stroke="#000000" stroke-width="7"/>
            <circle cx="2" cy="-112" r="15" fill="#000000"/>
            <g class="eyes">
                <circle cx="9" cy="-115" r="3" fill="#ff1a1a"/>
                <circle cx="1" cy="-115" r="3" fill="#ff1a1a"/>
            </g>
        </g>
    </defs>
    <circle cx="600" cy="120" r="110" fill="#8b0000" opacity="0.45"/>
    <circle cx="600" cy="120" r="70" fill="#d9d9c3"/>
    <circle cx="580" cy="100" r="12" fill="#b8b8a0"/>
    <circle cx="620" cy="140" r="16" fill="#b8b8a0"/>
    <circle cx="625" cy="95" r="8" fill="#b8b8a0"/>

    <g stroke="#000000" stroke-linecap="round" fill="none">
        <path d="M110 500 L125 300 L95 240 M125 300 L170 255 M122 340 L75 305 M95 240 L70 215 M95 240 L110 205 M170 255 L195 245" stroke-width="9"/>
    </g>

    <path d="M0 450 Q200 410 400 440 T800 425 L800 500 L0 500 Z" fill="#000000"/>

    <g fill="#1c1c1c" stroke="#3a3a3a" stroke-width="2">
        <path d="M250 455 v-45 a20 20 0 0 1 40 0 v45 z"/>
        <path d="M470 450 v-38 a18 18 0 0 1 36 0 v38 z"/>
        <path d="M700 445 v-50 a20 20 0 0 1 40 0 v50 z"/>
        <path d="M40 460 v-30 a16 16 0 0 1 32 0 v30 z"/>
    </g>
    <g stroke="#3a3a3a" stroke-width="3">
        <line x1="270" y1="418" x2="270" y2="442"/>
        <line x1="260" y1="428" x2="280" y2="428"/>
    </g>

    <g transform="translate(330 445)">
        <use class="sway" href="#zom"/>
    </g>
    <g transform="translate(560 440) scale(1.2)">
        <use class="sway slow" href="#zom"/>
    </g>
    <g transform="translate(160 455) scale(0.8)">
        <use class="sway slow" href="#zom"/>
    </g>
    <g transform="translate(650 455) scale(0.9)">
        <use class="sway" href="#zom"/>
    </g>
</svg>